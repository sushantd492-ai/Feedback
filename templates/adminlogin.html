<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{

height:100vh;

background:url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;

}

body::before{

content:"";
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,.55);

}

.login-box{

position:relative;

width:400px;

padding:40px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(15px);

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.5);

color:white;

text-align:center;

}

.login-box h1{

margin-bottom:30px;

}

input{

width:100%;

padding:15px;

margin:10px 0;

border:none;

outline:none;

border-radius:10px;

font-size:16px;

}

button{

width:100%;

padding:15px;

margin-top:20px;

background:#0d6efd;

color:white;

font-size:18px;

border:none;

border-radius:10px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#084298;

}

.error{

color:#ffb3b3;

margin-bottom:10px;

}

</style>

</head>

<body>

<div class="login-box">

<h1>Administrator Login</h1>

{% if error %}
<p class="error">{{error}}</p>
{% endif %}

<form action="/adminlogin" method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button>
Login
</button>

</form>

</div>

</body>
</html>
