<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Password Reset</title>

<style>

body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:'Segoe UI',sans-serif;

    background:
    linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
    url("https://images.unsplash.com/photo-1498243691581-b145c3f54a5a?auto=format&fit=crop&w=1920&q=80");

    background-size:cover;

}

.box{

    width:400px;

    max-width:90%;

    padding:40px;

    text-align:center;

    color:white;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.25);

    border-radius:22px;

    box-shadow:0 20px 50px rgba(0,0,0,.5);

}

.icon{

    width:75px;

    height:75px;

    margin:auto;

    border-radius:50%;

    background:#22c55e;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:40px;

}

h1{
    margin:20px 0 10px;
}

p{
    color:#ddd;
}

a{

    display:block;

    margin-top:25px;

    padding:14px;

    border-radius:10px;

    background:linear-gradient(
        135deg,
        #007bff,
        #00c6ff
    );

    color:white;

    text-decoration:none;

    font-weight:bold;

}

</style>

</head>

<body>

<div class="box">

    <div class="icon">✓</div>

    <h1>Password Reset!</h1>

    <p>
        Your password has been changed successfully.
    </p>

    <a href="/">
        Back to Login
    </a>

</div>

</body>

</html>
