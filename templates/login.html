<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    
     <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

    background-image:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
    url("https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1920&q=80");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.login-container{

    width:420px;
    padding:40px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(15px);

    border-radius:20px;

    border:1px solid rgba(255,255,255,.25);

    box-shadow:0 15px 35px rgba(0,0,0,.4);

    text-align:center;

    color:white;
}

.login-container h2{

    color:white;
    font-size:34px;
    margin-bottom:8px;

}

.subtitle{

    color:#ddd;
    margin-bottom:30px;

}

.input-box{

    margin-bottom:20px;
    text-align:left;

}

.input-box label{

    color:white;
    display:block;
    margin-bottom:8px;

}

.input-box input{

    width:100%;
    padding:14px;

    border:none;

    outline:none;

    border-radius:10px;

    background:rgba(255,255,255,.25);

    color:white;

    font-size:16px;

}

.input-box input::placeholder{

    color:#eee;

}

.login-btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    background:linear-gradient(45deg,#0066ff,#00c6ff);

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}

.login-btn:hover{

    transform:translateY(-3px);

    box-shadow:0 8px 20px rgba(0,0,0,.4);

}

.links{

    margin-top:20px;

    color:white;

}

.links a{

    color:#9fdcff;

    text-decoration:none;

    font-weight:bold;

}

/* Forgot Password */

.forgot-link{
    display:block;
    margin-top:18px;
    color:#9fdcff;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.forgot-link:hover{
    color:white;
    text-decoration:underline;
}

.signup-text{
    margin-top:12px;
    color:white;
    font-size:16px;
}

.signup-text a{
    color:#9fdcff;
    text-decoration:none;
    font-weight:bold;
    margin-left:4px;
}

.signup-text a:hover{
    color:white;
    text-decoration:underline;
}

</style>

</head>
<body>

    <div class="login-container">
       
        <h2>Login</h2>
        
        <p class="subtitle">
        Student Feedback System
        </p>
      
        {% if error %}
      <p style="color:red; text-align:center;">{{ error }}</p>
        {% endif %}
        <form action="/login" method="POST">
            <div class="input-box">
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>
    </div>

    <div class="input-box">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>
    </div>

    <button type="submit" class="login-btn">Login</button>

   
        </form>

<a href="/forgot_password" class="forgot-link">
    Forgot Password?
</a>

<div class="signup-text">
    Don't have an account?
    <a href="/signup">Sign Up</a>
</div>

</body>
</html>
