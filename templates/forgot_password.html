<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
    url("https://images.unsplash.com/photo-1498243691581-b145c3f54a5a?auto=format&fit=crop&w=1920&q=80");

    background-size:cover;
    background-position:center;
}

.container{

    width:420px;
    max-width:90%;

    padding:40px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.25);

    border-radius:22px;

    color:white;

    box-shadow:0 20px 50px rgba(0,0,0,.5);

}

h1{

    text-align:center;
    margin-bottom:10px;

}

.subtitle{

    text-align:center;
    color:#ddd;

    margin-bottom:30px;

}

label{

    display:block;

    margin-bottom:8px;

    font-weight:bold;

}

input{

    width:100%;

    padding:14px;

    border:none;

    outline:none;

    border-radius:10px;

    margin-bottom:20px;

    font-size:16px;

}

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    background:linear-gradient(
        135deg,
        #007bff,
        #00c6ff
    );

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    transform:translateY(-3px);

    box-shadow:0 10px 25px rgba(0,198,255,.4);

}

.error{

    background:rgba(255,0,0,.2);

    border:1px solid rgba(255,100,100,.5);

    padding:10px;

    border-radius:8px;

    text-align:center;

    margin-bottom:20px;

}

.back{

    display:block;

    text-align:center;

    margin-top:20px;

    color:#8ed8ff;

    text-decoration:none;

}

</style>

</head>

<body>

<div class="container">

    <h1>🔐 Forgot Password?</h1>

    <p class="subtitle">
        Enter your registered email address
    </p>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <label>Email Address</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Send OTP
        </button>

    </form>

    <a href="/" class="back">
        ← Back to Login
    </a>

</div>

</body>

</html>
