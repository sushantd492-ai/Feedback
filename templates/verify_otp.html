<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Verify OTP</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
    url("https://images.unsplash.com/photo-1498243691581-b145c3f54a5a?auto=format&fit=crop&w=1920&q=80");

    background-size:cover;
    background-position:center;
}

.container{

    width:420px;
    max-width:90%;

    padding:40px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.25);

    border-radius:22px;

    color:white;

    box-shadow:0 20px 50px rgba(0,0,0,.5);

}

h1{
    text-align:center;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#ddd;
    margin-bottom:25px;
}

input{

    width:100%;

    padding:14px;

    border:none;

    outline:none;

    border-radius:10px;

    font-size:20px;

    text-align:center;

    letter-spacing:8px;

    margin-bottom:20px;

}

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    background:linear-gradient(
        135deg,
        #007bff,
        #00c6ff
    );

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}

button:hover{

    transform:translateY(-2px);

}

.error{

    background:rgba(255,0,0,.2);

    padding:10px;

    border-radius:8px;

    text-align:center;

    margin-bottom:20px;

}

</style>

</head>

<body>

<div class="container">

    <h1>🔑 Verify OTP</h1>

    <p>
        Enter the 6-digit OTP shown in your terminal.
    </p>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="otp"
            maxlength="6"
            pattern="[0-9]{6}"
            placeholder="000000"
            required
        >

        <button type="submit">
            Verify OTP
        </button>

    </form>

</div>

</body>

</html>
