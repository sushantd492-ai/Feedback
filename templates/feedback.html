<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Feedback Form</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:
    linear-gradient(rgba(0,0,0,.60),rgba(0,0,0,.60)),
    url("https://images.unsplash.com/photo-1498243691581-b145c3f54a5a?auto=format&fit=crop&w=1920&q=80");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

/* Header */

header{
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(10px);
    color:white;
    text-align:center;
    padding:25px;
}

header h1{
    font-size:40px;
}

header p{
    margin-top:10px;
    color:#ddd;
}

/* Navigation */

nav{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:15px;
    background:rgba(255,255,255,.10);
    backdrop-filter:blur(10px);
}

nav a{
    color:white;
    text-decoration:none;
    padding:12px 22px;
    border-radius:8px;
    transition:.3s;
    font-weight:bold;
}

nav a:hover{
    background:#007bff;
}

/* Form */

.container{

    width:750px;
    max-width:92%;

    margin:50px auto;

    padding:35px;

    border-radius:20px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(18px);

    box-shadow:0 10px 30px rgba(0,0,0,.35);

    color:white;

}

.container h2{

    text-align:center;

    margin-bottom:30px;

    font-size:34px;

}

table{
    width:100%;
}

td{
    padding:12px;
}

td:first-child{
    width:35%;
    font-weight:bold;
    color:white;
}

/* Inputs */

input[type=text],
select,
textarea{

    width:100%;

    padding:13px;

    border:none;

    outline:none;

    border-radius:10px;

    background:rgba(255,255,255,.20);

    color:white;

    font-size:16px;

}

input[type=text]::placeholder,
textarea::placeholder{

    color:#eee;

}

select option{
    color:black;
}

textarea{
    resize:none;
}

input:focus,
select:focus,
textarea:focus{

    background:rgba(255,255,255,.28);

    box-shadow:0 0 10px rgba(0,198,255,.5);

}

/* Rating */

.rating label{

    display:block;

    margin-bottom:10px;

    color:white;

}

.rating input{

    margin-right:8px;

}

/* Buttons */

.buttons{

    text-align:center;

    padding-top:25px;

}

input[type=submit],
input[type=reset]{

    padding:14px 30px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:17px;

    color:white;

    transition:.3s;

}

input[type=submit]{

    background:linear-gradient(45deg,#00b09b,#96c93d);

}

input[type=reset]{

    background:linear-gradient(45deg,#ff416c,#ff4b2b);

}

input[type=submit]:hover,
input[type=reset]:hover{

    transform:translateY(-4px);

    box-shadow:0 10px 20px rgba(0,0,0,.35);

}

/* Footer */

footer{

    margin-top:40px;

    background:rgba(0,0,0,.45);

    backdrop-filter:blur(10px);

    color:white;

    text-align:center;

    padding:20px;

}

/* Mobile */

@media(max-width:768px){

nav{
    flex-wrap:wrap;
}

header h1{
    font-size:30px;
}

.container{
    padding:20px;
}

table,
tr,
td{
    display:block;
    width:100%;
}

td:first-child{
    margin-top:15px;
}

input[type=submit],
input[type=reset]{
    width:100%;
    margin:10px 0;
}

}
</style>
</head>

<body>

<header>
    <h1>🎓 Student Feedback System</h1>
    <p>Your Feedback Helps Us Improve</p>
</header>

<nav>
    <a href="/home">Home</a>
    <a href="/feedback">Feedback</a>
      <a href="/report">Report</a>
    <a href="/about">About</a>
    <a href="/ai">AI Assistant</a>
    <a href="/logout">Logout</a>
</nav>

<div class="container">

<h2>Student Feedback Form</h2>

<form action="/submit" method="POST">

<table>

<tr>
<td>Student Name</td>
<td>
<input type="text" name="name" placeholder="Enter your name" required>
</td>
</tr>

<tr>
<td>Roll Number</td>
<td>
<input type="text" name="rollno" placeholder="Enter roll number" required>
</td>
</tr>

<tr>
<td>Department</td>
<td>
<select name="department" required>
<option value="">Select Department</option>
<option>Computer Engineering</option>
<option>Information Technology</option>
<option>Mechanical Engineering</option>
<option>Civil Engineering</option>
<option>Electrical Engineering</option>
</select>
</td>
</tr>

<tr>
<td>Semester</td>
<td>
<select name="semester" required>
<option value="">Select Semester</option>
<option>Semester I</option>
<option>Semester II</option>
<option>Semester III</option>
<option>Semester IV</option>
<option>Semester V</option>
<option>Semester VI</option>
</select>
</td>
</tr>

<tr>
<td>Faculty Name</td>
<td>
<input type="text" name="teacher" placeholder="Faculty name" required>
</td>
</tr>

<tr>
<td>Subject</td>
<td>
<input type="text" name="subject" placeholder="Subject name" required>
</td>
</tr>

<tr>
<td>Teaching Rating</td>
<td class="rating">

<label>
<input type="radio" name="rating" value="Excellent" required>
⭐ Excellent
</label>

<label>
<input type="radio" name="rating" value="Good">
😊 Good
</label>

<label>
<input type="radio" name="rating" value="Average">
😐 Average
</label>

<label>
<input type="radio" name="rating" value="Poor">
😞 Poor
</label>

</td>
</tr>

<tr>
<td>Comments</td>
<td>
<textarea name="comments" rows="5" placeholder="Write your valuable feedback here..." required></textarea>
</td>
</tr>

<tr>
<td colspan="2" class="buttons">
<input type="submit" value="Submit Feedback">
<input type="reset" value="Clear Form">
</td>
</tr>

</table>

</form>

</div>

<footer>
    &copy; 2026 Student Feedback System | All Rights Reserved
</footer>

</body>
</html>
